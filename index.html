<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulator Alat Ukur Fisika</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .tool-selector {
            display: flex;
            gap: 10px;
        }
        .tool-selector label {
            background: #e9ecef;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .tool-selector input[type="radio"] {
            display: none;
        }
        .tool-selector input[type="radio"]:checked + label {
            background: #3498db;
            color: white;
        }
        .slider-container {
            width: 80%;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }
        canvas {
            background-color: #fafafa;
            border: 1px solid #ddd;
            border-radius: 5px;
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        #result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f6f3;
            border-left: 5px solid #1abc9c;
            border-radius: 5px;
            text-align: left;
            display: none;
            font-size: 18px;
            line-height: 1.6;
        }
        .math {
            font-family: monospace;
            font-size: 18px;
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h1>Simulator Alat Ukur Fisika</h1>
    
    <div class="container">
        <div class="controls">
            <div class="tool-selector">
                <input type="radio" id="jangka" name="tool" value="jangka" checked onchange="switchTool()">
                <label for="jangka">Jangka Sorong</label>
                
                <input type="radio" id="mikro" name="tool" value="mikro" onchange="switchTool()">
                <label for="mikro">Mikrometer Sekrup</label>
            </div>
            
            <div class="slider-container">
                <span id="min-val">0</span>
                <input type="range" id="measurementSlider" min="0" max="50" step="0.1" value="12.3" oninput="updateCanvas()">
                <span id="max-val">50 mm</span>
            </div>
        </div>

        <canvas id="simCanvas" width="700" height="250"></canvas>
        <br>
        <button onclick="toggleResult()">Tampilkan Cara Baca</button>

        <div id="result-box">
            <!-- Hasil akan dirender di sini -->
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('measurementSlider');
        const resultBox = document.getElementById('result-box');
        
        let currentTool = 'jangka'; // 'jangka' atau 'mikro'
        let showResult = false;

        function switchTool() {
            currentTool = document.querySelector('input[name="tool"]:checked').value;
            showResult = false;
            resultBox.style.display = 'none';

            if (currentTool === 'jangka') {
                slider.max = 50;
                slider.step = 0.1;
                slider.value = (Math.random() * 40).toFixed(1);
                document.getElementById('max-val').innerText = '50 mm';
            } else {
                slider.max = 15;
                slider.step = 0.01;
                slider.value = (Math.random() * 10).toFixed(2);
                document.getElementById('max-val').innerText = '15 mm';
            }
            updateCanvas();
        }

        function toggleResult() {
            showResult = !showResult;
            resultBox.style.display = showResult ? 'block' : 'none';
            updateCanvas();
        }

        function drawJangkaSorong(valMm) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Konversi mm ke pixel untuk skala gambar (1 mm = 10 px)
            const scale = 10; 
            const offsetX = 50; // Jarak dari pinggir kiri
            const mainY = 100; // Posisi Y garis skala utama
            const noniusY = 100; // Posisi Y garis skala nonius (berimpit)

            // 1. Gambar Skala Utama (Atas)
            ctx.beginPath();
            ctx.moveTo(offsetX, mainY);
            ctx.lineTo(canvas.width, mainY);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#333';
            ctx.stroke();

            ctx.fillStyle = '#333';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';

            for (let i = 0; i <= 60; i++) {
                let x = offsetX + (i * scale);
                ctx.beginPath();
                ctx.moveTo(x, mainY);
                if (i % 10 === 0) { // Angka per cm (10 mm)
                    ctx.lineTo(x, mainY - 20);
                    ctx.fillText((i / 10).toString(), x, mainY - 25);
                } else if (i % 5 === 0) { // Garis tengah
                    ctx.lineTo(x, mainY - 15);
                } else { // Garis biasa
                    ctx.lineTo(x, mainY - 10);
                }
                ctx.stroke();
            }

            // 2. Gambar Skala Nonius (Bawah, bergeser sesuai nilai)
            const shiftX = offsetX + (valMm * scale);
            
            // Background blok nonius (simulasi rahang geser)
            ctx.fillStyle = 'rgba(52, 152, 219, 0.1)';
            ctx.fillRect(shiftX - 20, noniusY, 150, 60);
            
            ctx.beginPath();
            ctx.moveTo(shiftX - 20, noniusY);
            ctx.lineTo(shiftX + 150, noniusY);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#2980b9';
            ctx.stroke();

            ctx.fillStyle = '#2980b9';
            // Skala nonius: 10 skala panjangnya 9 mm (0.9 mm per skala)
            for (let i = 0; i <= 10; i++) {
                let nx = shiftX + (i * 9); 
                ctx.beginPath();
                ctx.moveTo(nx, noniusY);
                if (i === 0 || i === 5 || i === 10) {
                    ctx.lineTo(nx, noniusY + 20);
                    ctx.fillText(i.toString(), nx, noniusY + 35);
                } else {
                    ctx.lineTo(nx, noniusY + 12);
                }
                ctx.stroke();
            }

            // Highlight garis berimpit
            if (showResult) {
                let su = Math.floor(valMm / 10) * 10 + Math.floor(valMm % 10); // mm
                let sn = Math.round((valMm - su) * 10); // skala ke-berapa (0-10)
                
                let berimpitX = shiftX + (sn * 9);
                ctx.beginPath();
                ctx.moveTo(berimpitX, mainY - 20);
                ctx.lineTo(berimpitX, noniusY + 20);
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = '#333';
            }

            // Update Teks Hasil
            let valCm = valMm / 10;
            let suText = Math.floor(valMm * 10) / 100; // cm utama sebelum 0
            suText = Math.floor(valMm) / 10; 
            let snText = Math.round((valMm - Math.floor(valMm)) * 10); // index 0-10

            resultBox.innerHTML = `
                <b>Analisis Jangka Sorong:</b><br><br>
                1. <b>Skala Utama (SU):</b> Angka di atas kiri sebelum angka nol nonius adalah <span class="math">${suText.toFixed(1)} cm</span>.<br>
                2. <b>Skala Nonius (SN):</b> Garis bawah yang sejajar lurus dengan atas adalah garis ke-<span class="math">${snText}</span>.<br>
                3. <b>Perhitungan:</b><br>
                &nbsp;&nbsp;&nbsp;SU = ${suText.toFixed(1)} cm<br>
                &nbsp;&nbsp;&nbsp;SN = ${snText} × 0,01 cm = ${(snText * 0.01).toFixed(2)} cm<br>
                &nbsp;&nbsp;&nbsp;<b>Total</b> = SU + SN = <span class="math">${valCm.toFixed(2)} cm</span>
            `;
        }

        function drawMikrometer(valMm) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const scale = 30; // 1 mm = 30 px untuk batang utama
            const offsetX = 50; 
            const centerY = 120; 
            const barrelRadius = 40;

            // Gambar batang tetap (Skala Utama)
            ctx.fillStyle = '#ddd';
            ctx.fillRect(offsetX, centerY - barrelRadius, valMm * scale + 10, barrelRadius * 2);
            
            ctx.beginPath();
            ctx.moveTo(offsetX, centerY);
            ctx.lineTo(offsetX + (valMm * scale) + 10, centerY); // Garis horizontal tengah
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#333';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';

            // Ticks Utama (Atas 1mm, Bawah 0.5mm)
            for (let i = 0; i <= Math.floor(valMm * 2) + 1; i++) {
                let x = offsetX + (i * 0.5 * scale);
                if (x > offsetX + (valMm * scale)) continue; // Jangan gambar melebihi thimble

                ctx.beginPath();
                ctx.moveTo(x, centerY);
                if (i % 2 === 0) { // Skala atas (1 mm)
                    ctx.lineTo(x, centerY - 15);
                    if (i % 4 === 0 || i === 0) { // Angka setiap 2mm biar tidak numpuk, tp mikrometer standar nulis 0,5,10
                         ctx.fillText((i / 2).toString(), x, centerY - 20);
                    }
                } else { // Skala bawah (0.5 mm)
                    ctx.lineTo(x, centerY + 15);
                }
                ctx.stroke();
            }

            // Gambar Thimble (Skala Putar)
            const thimbleX = offsetX + (valMm * scale);
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(thimbleX, centerY - 50, 150, 100);
            ctx.strokeRect(thimbleX, centerY - 50, 150, 100);
            
            // Garis pembatas thimble
            ctx.beginPath();
            ctx.moveTo(thimbleX, centerY - 50);
            ctx.lineTo(thimbleX, centerY + 50);
            ctx.lineWidth = 3;
            ctx.stroke();

            // Hitung nilai skala putar (0 - 49)
            // 1 putaran = 0.5 mm = 50 skala
            let sisaPutar = valMm % 0.5; // mm (0 s/d 0.49)
            let skalaPutar = Math.round(sisaPutar / 0.01); // 0 - 49

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            
            // Gambar skala putar melingkar (simulasi 2D)
            for (let i = -10; i <= 10; i++) {
                let targetTick = skalaPutar + i;
                if (targetTick < 0) targetTick += 50;
                if (targetTick >= 50) targetTick -= 50;
                
                // Jarak vertikal per tick (simulasi perspektif silinder)
                let yOffset = i * 8; 
                
                if (centerY + yOffset > centerY - 45 && centerY + yOffset < centerY + 45) {
                    ctx.beginPath();
                    ctx.moveTo(thimbleX, centerY + yOffset);
                    let lineLength = (targetTick % 5 === 0) ? 20 : 10;
                    ctx.lineTo(thimbleX + lineLength, centerY + yOffset);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = '#333';
                    ctx.stroke();

                    if (targetTick % 5 === 0) {
                        ctx.fillText(targetTick.toString(), thimbleX + 25, centerY + yOffset);
                    }
                }
            }

            // Highlight garis berimpit
            if (showResult) {
                ctx.beginPath();
                ctx.moveTo(offsetX, centerY);
                ctx.lineTo(thimbleX + 60, centerY);
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = '#333';
            }

            // Update Teks Hasil
            let suValue = Math.floor(valMm * 2) / 2; // kelipatan 0.5 terdekat ke bawah
            let spValue = Math.round((valMm - suValue) / 0.01);

            resultBox.innerHTML = `
                <b>Analisis Mikrometer Sekrup:</b><br><br>
                1. <b>Skala Utama (SU):</b> Garis terakhir yang terlihat di batang sebelum batas putar adalah <span class="math">${suValue.toFixed(2)} mm</span>.<br>
                2. <b>Skala Putar (SP):</b> Angka yang sejajar lurus dengan garis mendatar utama adalah <span class="math">${spValue}</span>.<br>
                3. <b>Perhitungan:</b><br>
                &nbsp;&nbsp;&nbsp;SU = ${suValue.toFixed(2)} mm<br>
                &nbsp;&nbsp;&nbsp;SP = ${spValue} × 0,01 mm = ${(spValue * 0.01).toFixed(2)} mm<br>
                &nbsp;&nbsp;&nbsp;<b>Total</b> = SU + SP = <span class="math">${valMm.toFixed(2)} mm</span>
            `;
        }

        function updateCanvas() {
            let val = parseFloat(slider.value);
            if (currentTool === 'jangka') {
                drawJangkaSorong(val);
            } else {
                drawMikrometer(val);
            }
        }

        // Inisialisasi awal
        window.onload = () => {
            switchTool(); 
        };
    </script>
</body>
</html>
